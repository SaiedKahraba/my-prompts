<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مكتبة الأوامر الشاملة:أكتر من 500+ إطار عمل للذكاء الاصطناعي 🚀</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* تعريف الألوان للوضعين العادي والليلي */
        :root {
            --bg-body: #ffffff;
            --bg-aside: #fbfbfa;
            --text-color: #37352f;
            --border-color: #e9e9e7;
            --card-bg: #ffffff;
            --input-bg: #f4f4f2;
            --hover-item: rgba(55, 53, 47, 0.08);
        }

        .dark-mode {
            --bg-body: #0f172a;
            --bg-aside: #1e293b;
            --text-color: #f1f5f9;
            --border-color: #334155;
            --card-bg: #1e293b;
            --input-bg: #334155;
            --hover-item: rgba(255, 255, 255, 0.1);
        }

        body { 
            font-family: 'IBM Plex Sans Arabic', sans-serif; 
            background-color: var(--bg-body); 
            color: var(--text-color); 
            text-align: right; 
            /* منع تحديد النص يدوياً */
            user-select: none; 
            -webkit-user-select: none;
            transition: all 0.3s ease;
        }

        .notion-shadow { box-shadow: rgba(15, 15, 15, 0.05) 0px 0px 0px 1px, rgba(15, 15, 15, 0.1) 0px 2px 4px; }
        .sidebar-item:hover, .sidebar-item.active { background-color: var(--hover-item); font-weight: 600; color: #2eaadc; }
        
        aside { background-color: var(--bg-aside); border-color: var(--border-color) !important; }
        main { background-color: var(--bg-body); }
        header { background-color: var(--bg-body); border-color: var(--border-color) !important; }

        .category-card { border: 1px solid var(--border-color); background-color: var(--card-bg); color: var(--text-color); transition: all 0.2s ease; cursor: pointer; padding: 1.25rem; border-radius: 0.75rem; text-align: center; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .category-card:hover { transform: translateY(-2px); border-color: #2eaadc; }
        
        .prompt-box { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 1.25rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; transition: all 0.2s; color: var(--text-color); }
        .prompt-box:hover { background: var(--hover-item); border-color: #2eaadc; }
        
        input { background-color: var(--input-bg) !important; color: var(--text-color) !important; border: none !important; }
        
        .copy-btn { background: var(--card-bg); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; font-weight: 600; flex-shrink: 0; color: var(--text-color); }
        .copy-btn:hover { background: #2eaadc; color: white; border-color: #2eaadc; }
        
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #2eaadc; color: white; padding: 12px 24px; border-radius: 30px; display: none; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.15); font-weight: 600; }
        
        /* شاشة الحماية */
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-body); z-index: 9999; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        
        /* عداد الزوار */
        .visitor-count-box { background: #2eaadc15; border: 1px solid #2eaadc30; color: #2eaadc; padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; margin-top: 10px; display: inline-flex; align-items: center; gap: 5px; }

        .whitespace-pre-wrap { user-select: text; -webkit-user-select: text; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #d3d3d1; border-radius: 10px; }

        .theme-toggle-btn { cursor: pointer; font-size: 1.2rem; padding: 8px; border-radius: 50%; transition: background 0.3s; }
        .theme-toggle-btn:hover { background: var(--hover-item); }
    </style>
</head>
<body class="overflow-hidden" oncontextmenu="return false"> <div id="auth-overlay">جاري التحقق من الصلاحية...</div>
<div id="toast" class="toast">تم نسخ النص بنجاح ✨</div>

<div class="flex h-screen overflow-hidden">

                <div class="w-10 h-10 bg-black rounded-lg flex items-center justify-center text-white font-bold text-xl shadow-lg">S</div>

            </div>
            <div class="visitor-count-box">

            </div>
        </div>
        <nav class="flex-1 overflow-y-auto p-3" id="sidebarNav">

            <div class="px-4 py-4 text-[11px] font-bold text-gray-400 uppercase tracking-widest border-t mt-2 mb-1">تصفح الأقسام الـ 31</div>
            <div id="sidebarCategories"></div>
            <div class="mt-10 p-4 text-[11px] text-gray-400 border-t border-dashed">
                تمت إنشاء المكتبة من قبل Saeed Sameh
            </div>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col min-w-0">
        <header class="h-16 border-b flex items-center px-6 sticky top-0 z-10 text-right shadow-sm">
            <div class="flex-1 max-w-2xl mx-auto relative flex items-center gap-4">
                <div class="relative flex-1">
                    <input type="text" id="globalSearch" oninput="handleSearch()" placeholder="ابحث في مكتبة البرومبتات ..." class="w-full rounded-xl py-2.5 px-5 text-sm outline-none focus:ring-2 focus:ring-blue-400 text-right">

        </div>

</div>

<script>
// --- إعدادات الحماية والعداد ---
const PASS = "promptssaeed90";
const VISIT_API = "https://api.countapi.xyz/hit/saied-sameh-prompts/visits";

async function logVisit() {
    try {
        const res = await fetch(VISIT_API);
        const data = await res.json();
        document.getElementById('v-count').innerText = data.value;
    } catch(e) { document.getElementById('v-count').innerText = "متصل"; }
}

function checkAccess() {
    const entry = prompt("برجاء إدخال كلمة المرور للوصول إلى مكتبة الأوامر الشاملة:");
    if (entry === PASS) {
        document.getElementById('auth-overlay').style.display = 'none';
        logVisit();
        init();
    } else {
        alert("كلمة المرور غير صحيحة.");
        location.reload();
    }
}

// --- وظيفة الوضع الليلي ---
function toggleDarkMode() {
    const isDark = document.body.classList.toggle('dark-mode');
    localStorage.setItem('darkTheme', isDark);
    document.getElementById('themeBtn').innerText = isDark ? '☀️' : '🌙';
}

function loadTheme() {
    if (localStorage.getItem('darkTheme') === 'true') {
        document.body.classList.add('dark-mode');
        document.getElementById('themeBtn').innerText = '☀️';
    }
}

function init() {
    loadTheme();
    renderSidebar();
    showHome();
}

// الدوال الخاصة بك كما هي تماماً
function renderSidebar() {
    const container = document.getElementById('sidebarCategories');
    container.innerHTML = '';
    rawData.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = "sidebar-item w-full text-right px-4 py-2.5 rounded-lg text-sm mb-1 transition-all flex items-center justify-start gap-3";
        btn.onclick = () => showCategory(cat.id);
        btn.innerHTML = `<span class="text-xl">${cat.icon}</span> <span class="truncate">${cat.title}</span>`;
        container.appendChild(btn);
    });
}

function showHome() {
    const content = document.getElementById('contentArea');
    content.innerHTML = `
        <div class="mb-14 text-center lg:text-right">
            <h1 class="text-5xl font-extrabold mb-5 tracking-tight">مكتبة الأوامر الشاملة:أكتر من 500+ إطار عمل للذكاء الاصطناعي 🚀</h1>
            <p class="text-gray-500 text-xl font-medium">أقوى برومبتات التسويق، المبيعات، والكودينج (500+ برومبت مجمعين لك).</p>
        </div>
        <div id="categoriesGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5"></div>
    `;
    const grid = document.getElementById('categoriesGrid');
    rawData.forEach(cat => {
        const card = document.createElement('div');
        card.className = "category-card notion-shadow p-6 rounded-2xl hover:shadow-xl transition-all";
        card.onclick = () => showCategory(cat.id);
        card.innerHTML = `
            <div class="w-16 h-16 rounded-2xl flex items-center justify-center text-4xl mb-5 shadow-sm" style="background-color: ${cat.color}">${cat.icon}</div>
            <div class="font-bold text-base leading-tight mb-3">${cat.title}</div>
            <div class="text-xs font-bold text-blue-600 bg-blue-50 px-4 py-1.5 rounded-full">${cat.items.length} برومبت</div>
        `;
        grid.appendChild(card);
    });
    document.querySelectorAll('.sidebar-item').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-home').classList.add('active');
    window.scrollTo(0,0);
}

function showCategory(catId) {
    const cat = rawData.find(c => c.id === catId);
    const content = document.getElementById('contentArea');
    content.innerHTML = `
        <div class="flex items-center justify-between mb-10 pb-6 border-b">
             <h2 class="text-3xl font-bold flex items-center gap-4"><span>${cat.icon}</span> ${cat.title}</h2>
             <button onclick="showHome()" class="text-sm text-blue-600 font-bold hover:bg-blue-50 px-5 py-2.5 rounded-xl transition-all border border-blue-100">← العودة للرئيسية</button>
        </div>
        <div id="promptsList" class="space-y-5"></div>
    `;
    const list = document.getElementById('promptsList');
    cat.items.forEach((p, i) => {
        const box = document.createElement('div');
        box.className = "prompt-box notion-shadow p-5 rounded-xl";
        box.innerHTML = `
            <div class="prompt-content text-[15px] leading-relaxed flex-1 ml-5">
                <span class="text-gray-400 font-mono text-xs block mb-2 uppercase tracking-widest font-bold">PROMPT #${i+1}</span>
                <div class="whitespace-pre-wrap">${p}</div>
            </div>
            <button class="copy-btn self-start mt-6" onclick="copyText(this)">نسخ</button>
        `;
        list.appendChild(box);
    });
    document.getElementById('mainScroll').scrollTo({ top: 0, behavior: 'smooth' });
}

function handleSearch() {
    const q = document.getElementById('globalSearch').value.toLowerCase().trim();
    if(!q) { showHome(); return; }
    const results = [];
    rawData.forEach(cat => cat.items.forEach(item => {
        if(item.toLowerCase().includes(q)) results.push({text: item, category: cat.title, icon: cat.icon});
    }));
    const content = document.getElementById('contentArea');
    content.innerHTML = `
        <div class="flex items-center justify-between mb-10 pb-6 border-b">
            <h2 class="text-2xl font-bold">🔍 نتائج البحث عن: <span class="text-blue-500">"${q}"</span></h2>
            <button onclick="showHome()" class="text-sm text-gray-500 font-bold">إلغاء البحث</button>
        </div>
        <div id="resultsList" class="space-y-5"></div>
    `;
    const list = document.getElementById('resultsList');
    if(results.length === 0) {
        list.innerHTML = `<div class="text-center py-20 text-gray-400 text-lg">مفيش نتائج مطابقة لبحثك يا بطل.</div>`;
        return;
    }
    results.forEach(res => {
        const box = document.createElement('div');
        box.className = "prompt-box notion-shadow p-5";
        box.innerHTML = `
            <div class="text-[15px] leading-relaxed flex-1 ml-5">
                <span class="text-blue-500 font-bold text-[10px] uppercase mb-2 block bg-blue-50 w-fit px-2 py-0.5 rounded">${res.icon} ${res.category}</span>
                <div class="whitespace-pre-wrap">${res.text}</div>
            </div>
            <button class="copy-btn self-start mt-6" onclick="copyText(this)">نسخ</button>
        `;
        list.appendChild(box);
    });
}

function copyText(btn) {
    const contentDiv = btn.previousElementSibling;
    const text = contentDiv.querySelector('.whitespace-pre-wrap').innerText;
    navigator.clipboard.writeText(text).then(() => {
        const t = document.getElementById('toast');
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 1500);
    });
}

// بدء التشغيل بنظام الحماية
window.onload = checkAccess;
</script>
